name: VEYRO AI Gateway Check

on:
  workflow_dispatch:
    inputs:
      prompt:
        description: "Test prompt"
        required: true
        default: "Create a simple To-Do Android app"
        type: string

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Check AI secret exists
        env:
          AI_API_KEY: ${{ secrets.AI_API_KEY }}
        run: |
          test -n "$AI_API_KEY"
          echo "AI_API_KEY is configured."

      - name: Call OpenAI Responses API
        env:
          AI_API_KEY: ${{ secrets.AI_API_KEY }}
          PROMPT: ${{ inputs.prompt }}
        run: |
          python - <<'PY'
          import json, os, urllib.request
          data = json.dumps({
              "model": "gpt-5",
              "input": os.environ["PROMPT"],
              "max_output_tokens": 100
          }).encode()
          req = urllib.request.Request(
              "https://api.openai.com/v1/responses",
              data=data,
              headers={
                  "Content-Type": "application/json",
                  "Authorization": "Bearer " + os.environ["AI_API_KEY"]
              }
          )
          try:
              with urllib.request.urlopen(req, timeout=60) as response:
                  body = response.read().decode()
                  print("AI Gateway HTTP status:", response.status)
                  print(body[:3000])
          except urllib.error.HTTPError as e:
              print("AI Gateway HTTP status:", e.code)
              print(e.read().decode()[:3000])
              raise
          PY
