name: VEYRO Build Worker

on:
  push:
    branches: ["main"]
    paths:
      - "build-worker/**"
      - ".github/workflows/build-worker.yml"
  pull_request:
    paths:
      - "build-worker/**"
      - ".github/workflows/build-worker.yml"

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: build-worker
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm test
